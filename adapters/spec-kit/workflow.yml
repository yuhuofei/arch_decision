schema_version: "1.0"

workflow:
  id: "arch-decision-speckit"
  name: "Architecture-Governed Spec Kit"
  description: >
    Run Spec Kit only after arch_decision architecture acceptance.

  inputs:
    spec:
      type: string
      required: true
      prompt: "What do you want to build?"

  steps:

    - id: architecture
      type: prompt
      prompt: |
        Run the canonical arch_decision new-project workflow.

        Read:

        - AGENTS.md
        - .sdd/CANONICAL.md
        - .sdd/LAYOUT.md
        - .sdd/CONVENTIONS.md
        - .sdd/decision-trees/decision-protocol.md
        - .sdd/workflows/new-project.md

        Do not implement business code.

        Complete:

        Discovery
        Draft Spec
        Constraint Classification
        Architecture Decision
        Technology Selection

        Stop at:

        ACCEPTED
        REQUIRE_CONFIRMATION
        BLOCKED

    - id: architecture-gate
      type: gate
      message: |
        Review the architecture decision.

        Continue only if the architecture is accepted and
        all required human confirmations are complete.

      options:
        - approve
        - reject

      on_reject: abort

    - id: specify
      command: speckit.specify
      input:
        args: "{{ inputs.spec }}"

    - id: clarify
      command: speckit.clarify

    - id: plan
      type: prompt
      prompt: |
        Run the Spec Kit planning phase.

        IMPORTANT:

        The architecture has already been accepted by arch_decision.

        Treat:

        specs/001-project/decision.json
        specs/001-project/technology-selection.md

        as the architecture source of truth.

        Do not replace accepted technology choices.

        If the plan requires a different architecture,
        stop and report:

        ARCHITECTURE_CHANGE_REQUEST

    - id: tasks
      command: speckit.tasks

    - id: analyze
      command: speckit.analyze

    - id: implement-gate
      type: gate
      message: |
        Review specification, plan, tasks, and architecture.

        Approve implementation only if architecture remains accepted.

      options:
        - approve
        - reject

      on_reject: abort

    - id: implement
      command: speckit.implement

    - id: converge
      command: speckit.converge
