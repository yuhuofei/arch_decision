schema_version: "1.0"

adapter:
  id: "arch-decision"
  version: "1.0"

canonical:
  root: ".sdd"
  version_file: ".sdd/VERSION"

adapters:

  claude-code:
    type: "agent"
    entrypoint: "CLAUDE.md"
    commands:
      - "arch-new-project"
      - "arch-discover"
      - "arch-decide"
      - "arch-review"
      - "arch-gate"
      - "arch-verify"

  spec-kit:
    type: "workflow"
    workflow: "workflow.yml"
    gate: "architecture-gate.md"

  openspec:
    type: "change-workflow"
    gate: "architecture-gate.md"

contracts:

  architecture_gate:
    accepted_status: "ACCEPTED"

  architecture_change:
    request_marker: "ARCHITECTURE_CHANGE_REQUEST"

  implementation:
    requires_architecture_acceptance: true
